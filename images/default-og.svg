<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B13" />
      <stop offset="100%" stop-color="#0D1B2A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D1FF" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2ECC71" />
    </linearGradient>
    <radialGradient id="glowTeal" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#060B13" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#00D1FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#060B13" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glowTeal)" />
  <rect width="1200" height="630" fill="url(#glowCyan)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="20" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Badge Pill -->
  <rect x="80" y="90" width="370" height="42" rx="21" fill="rgba(0, 209, 255, 0.12)" stroke="rgba(0, 209, 255, 0.3)" stroke-width="1.5" />
  <text x="105" y="117" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#00D1FF" letter-spacing="2">THE PERSONAL GROWTH LABORATORY</text>

  <!-- Main Headline -->
  <text x="80" y="210" font-family="'Outfit', 'Inter', sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Supplemental Instruction</text>
  <text x="80" y="280" font-family="'Outfit', 'Inter', sans-serif" font-size="52" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.5">Evolving Human Development</text>

  <!-- Subheadline -->
  <text x="80" y="360" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="#94A3B8">Transition from survival fatigue to creative sovereignty.</text>
  <text x="80" y="396" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="#94A3B8">Biometric tracking, physical log handbooks, and vetted peer advisor circles.</text>

  <!-- Pillars row -->
  <g transform="translate(80, 470)">
    <rect x="0" y="0" width="230" height="65" rx="14" fill="rgba(12, 21, 36, 0.8)" stroke="rgba(46, 204, 113, 0.3)" stroke-width="1" />
    <text x="25" y="38" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#2ECC71">● Thrive Mode</text>

    <rect x="250" y="0" width="240" height="65" rx="14" fill="rgba(12, 21, 36, 0.8)" stroke="rgba(0, 209, 255, 0.3)" stroke-width="1" />
    <text x="275" y="38" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#00D1FF">● Reading Culture</text>

    <rect x="510" y="0" width="260" height="65" rx="14" fill="rgba(12, 12, 36, 0.8)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />
    <text x="535" y="38" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#F59E0B">● Alchemy Wealth</text>

    <rect x="790" y="0" width="250" height="65" rx="14" fill="rgba(12, 21, 36, 0.8)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
    <text x="815" y="38" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#A855F7">● Stoic Stillness</text>
  </g>
</svg>
