<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D1FF" />
      <stop offset="100%" stop-color="#2ECC71" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#060B13" />
  <rect width="100" height="100" rx="22" stroke="#00D1FF" stroke-opacity="0.3" stroke-width="2" />
  <!-- Center Core -->
  <circle cx="50" cy="50" r="7" fill="url(#grad1)" filter="url(#glow)" />
  <!-- Orbit 1 -->
  <ellipse cx="50" cy="50" rx="34" ry="14" stroke="#00D1FF" stroke-width="2.5" stroke-opacity="0.8" transform="rotate(30 50 50)" />
  <!-- Orbit 2 -->
  <ellipse cx="50" cy="50" rx="34" ry="14" stroke="#2ECC71" stroke-width="2.5" stroke-opacity="0.8" transform="rotate(-30 50 50)" />
  <!-- Orbit 3 -->
  <ellipse cx="50" cy="50" rx="34" ry="14" stroke="#00F2FE" stroke-width="2" stroke-opacity="0.5" transform="rotate(90 50 50)" />
  <circle cx="78" cy="40" r="3" fill="#00D1FF" filter="url(#glow)" />
  <circle cx="22" cy="60" r="3" fill="#2ECC71" filter="url(#glow)" />
</svg>
